<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stammbaum Hölzemann</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&amp;family=Alegreya+Sans:wght@400;500;700&amp;display=swap">
<style>
/* Layout: full-screen pan/zoom canvas, couples side by side with a marriage dot, each family on its own line lane */
:root{
  --bg:#EEF1EE; --paper:#FBFCFA; --ink:#1E2A2B; --muted:#5E6B6A; --line:#8E9C99;
  --anc:#1F6470; --anc-soft:#D6E8EA; --desc:#A0661A; --desc-soft:#F3E3C8; --sel:#0F3E46; --new:#B23A48;
  --display:"Alegreya",Georgia,"Times New Roman",serif; --ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141B1C; --paper:#1F2829; --ink:#E6ECEA; --muted:#9BA9A7; --line:#5A6B6A;
  --anc:#6CC0CC; --anc-soft:#1E3B40; --desc:#E0A75A; --desc-soft:#3E2F1A; --sel:#A6E3EA; --new:#F07A86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B1C; --paper:#1F2829; --ink:#E6ECEA; --muted:#9BA9A7; --line:#5A6B6A;
  --anc:#6CC0CC; --anc-soft:#1E3B40; --desc:#E0A75A; --desc-soft:#3E2F1A; --sel:#A6E3EA; --new:#F07A86; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--paper);z-index:3}
h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0}
.meta{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
input,textarea,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
#q{width:min(240px,60vw)}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 10px;line-height:1.15}
button:hover{border-color:var(--anc)}
button.primary{background:var(--anc);border-color:var(--anc);color:var(--paper);font-weight:700}
button.danger{color:var(--new);border-color:var(--new)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.node:focus-visible{outline:2px solid var(--anc);outline-offset:2px}
.save-state{font-size:.85rem;color:var(--new);font-weight:700}
.save-state.ok{color:var(--anc)}
.fin{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;z-index:-1}
.lbtn{display:inline-flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 10px;line-height:1.15;-webkit-user-select:none;user-select:none}
.lbtn:hover{border-color:var(--anc)}
.row.act{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row.act>button,.row.act>.lbtn{width:100%;min-height:40px;padding:8px 6px;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box}
.cropper{position:fixed;inset:0;z-index:20;background:#111;color:#fff;display:flex;flex-direction:column}
.cr-top{padding:12px 14px 8px;text-align:center}
.cr-stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.cr-img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-select:none}
.cr-frame{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.62);pointer-events:none;box-sizing:border-box}
.cr-hint{font-size:.8rem;text-align:center;opacity:.8;padding:8px 10px 0}
.cr-zoom{display:block;margin:8px 22px 4px;width:auto}
.cr-bar{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.cr-bar button{flex:1;min-height:42px}
.panel label.opt{display:flex;gap:10px;align-items:flex-start;font-size:1rem;color:var(--ink);margin:10px 0;line-height:1.35;cursor:pointer}
.panel label.opt input{width:auto;padding:0;margin:3px 0 0;flex:none;accent-color:var(--anc)}
.panel label.opt span{flex:1;min-width:0}
input[type=radio],input[type=checkbox]{width:auto;padding:0}
.panel{overflow-x:hidden}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.legend .bar{height:16px;border-radius:4px;border:1px solid var(--line)}
.legend .lg-l{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.legend .fam{display:flex;flex-wrap:wrap;gap:6px}
.legend .fam span{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 4px}
.legend .fam i{width:14px;height:14px;border-radius:50%;display:inline-block}
.car{margin:6px 0}
.car-wrap{position:relative}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:6px;background:var(--bg)}
.car-track::-webkit-scrollbar{display:none}
.car-slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;justify-content:center}
.car-slide img{height:240px;width:auto;max-width:100%;object-fit:contain;cursor:zoom-in;display:block}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);color:#000;border:none;border-radius:50%;width:30px;height:30px;padding:0;font-size:18px;line-height:1}
.car-nav.l{left:4px}.car-nav.r{right:4px}
.car-dots{display:flex;justify-content:center;gap:7px;margin:7px 0 2px}
.car-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer}
.car-dots i.on{background:var(--anc)}
.car-act{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.car-act button{min-height:38px}
.lightbox{touch-action:none;flex-direction:column}
.lb-cnt{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:.9rem;pointer-events:none}
@media (max-width:640px){.car-slide img{height:200px}}
.car-cap{margin:6px 2px 2px;font-size:.9rem;line-height:1.4;color:var(--ink);word-break:break-word}
.car-cap a{color:var(--anc);cursor:pointer;font-size:.85rem}
.car-cap textarea{min-height:72px;font-size:16px}
.car-cap .row{margin-top:6px;display:flex;gap:6px}
.lb-cap{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:1rem;padding:0 16px;pointer-events:none;text-shadow:0 1px 3px #000}
.node.changed::after{display:none!important}
#changes{display:none!important}
.panel .meta{margin:6px 0 2px;line-height:1.4}
@media (max-width:640px){
  .panel.edit:not([hidden]){position:fixed;inset:0;top:0;bottom:0;left:0;right:0;width:auto;max-height:none;border-radius:0;border:none;z-index:8;display:flex;flex-direction:column;padding:0 16px 55vh;box-shadow:none;-webkit-overflow-scrolling:touch}
  .panel.edit>.row{order:-1;position:sticky;top:0;z-index:2;background:var(--paper);margin:0 -16px 6px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .panel.edit>.x{display:none}
  .panel.edit>h2{margin:8px 0 2px}
  .panel.edit input,.panel.edit textarea{font-size:16px}
}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.stage.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;overflow:visible}
svg.edges path{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
svg.edges path.anc{stroke:var(--anc);stroke-width:3.2}
svg.edges path.desc{stroke:var(--desc);stroke-width:3.2}
.union{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1.6px solid var(--line);transform:translate(-50%,-50%);z-index:1}
.union.anc{border-color:var(--anc);background:var(--anc)}
.union.desc{border-color:var(--desc);background:var(--desc)}
.ulabel{position:absolute;transform:translate(-50%,-100%);font-size:10.5px;line-height:1.15;color:var(--muted);text-align:center;width:66px;font-variant-numeric:tabular-nums}
.node{position:absolute;width:200px;height:74px;padding:7px 10px;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)),var(--paper);border:1px solid var(--line);border-radius:4px;
  cursor:pointer;display:flex;align-items:center;gap:8px;z-index:1}
.node .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.node img{width:46px;height:56px;object-fit:cover;border-radius:3px;flex:none}
.node .n{font-family:var(--display);font-weight:500;font-size:14px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .d{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.node.unk{border-style:dashed;background:var(--bg)}
.node.unk .n{font-family:var(--ui);font-style:italic;color:var(--muted);font-size:13px}
.node.anc{border-color:var(--anc);background:var(--anc-soft)}
.node.desc{border-color:var(--desc);background:var(--desc-soft)}
.node.sel{border:2px solid var(--sel)}
.node.changed::after{content:"";position:absolute;right:6px;bottom:6px;width:8px;height:8px;border-radius:50%;background:var(--new)}
.node.hasnote .n::after{content:" ✎";color:var(--muted);font-size:11px}
.focus .node:not(.anc):not(.desc):not(.sel),.focus .union:not(.anc):not(.desc){opacity:.6}
.tg{position:absolute;z-index:2;transform:translate(-50%,-50%);border-radius:999px;padding:1px 7px;font-size:11px;line-height:16px;min-width:20px;
  background:var(--paper);border:1px solid var(--line);color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.tg:hover{border-color:var(--anc);color:var(--anc)}
.tg.closed{background:var(--anc);border-color:var(--anc);color:var(--paper)}
.panel{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;width:330px;max-height:calc(100% - 24px);overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:14px 16px;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.14);cursor:auto}
.panel h2{font-family:var(--display);font-size:1.2rem;margin:0 26px 4px 0;line-height:1.2}
.panel .life{color:var(--muted);margin-bottom:8px;line-height:1.45}
.panel h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 4px}
.panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.panel a{color:var(--anc);text-decoration:none;cursor:pointer}
.panel a:hover{text-decoration:underline}
.panel .mn{position:absolute;right:38px;top:10px;border:none;background:none;font-size:16px;padding:2px 8px;line-height:1.2}
.panel.min{padding:8px 80px 8px 12px;overflow:hidden;max-height:none;cursor:pointer;width:auto;max-width:330px}
.panel.min>*:not(h2):not(.x):not(.mn){display:none!important}
.panel.min h2{margin:0;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel.min .x,.panel.min .mn{top:5px}
@media (max-width:640px){.panel.min{max-width:none}}
.panel .x{position:absolute;right:10px;top:10px;border:none;background:none;font-size:18px;padding:2px 6px}
.panel .note{white-space:pre-wrap;line-height:1.45;background:var(--bg);padding:8px 10px;border-radius:6px}
.panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.panel label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 3px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;cursor:zoom-in;display:block}
.photos .rm{position:absolute;right:2px;top:2px;padding:0 6px;font-size:13px;background:var(--paper)}
.hint{font-size:.85rem;color:var(--muted);margin-top:10px;line-height:1.4}
.zoom{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:3;flex-wrap:wrap;max-width:calc(100% - 24px)}
.zoom button{background:var(--paper);min-width:36px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.lightbox img{max-width:94vw;max-height:94vh}
.nojs{position:absolute;inset:0;overflow:auto;background:var(--bg);z-index:5;cursor:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nojs-box{max-width:680px;margin:0 auto;line-height:1.5}
.nojs-box h2{font-family:var(--display);margin:0 0 8px}
.nojs-box ul{padding-left:18px}
.nojs-box li{margin:2px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;z-index:10}
@media (max-width:640px){.panel{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:64px;width:auto;max-height:55%}}
</style>
</head>

<script>
"use strict";
let EDIT=true;
{const nj=document.getElementById("nojs");if(nj)nj.hidden=true;}
let DATA={version:2,persons:[],unions:[]};
let people={},unions=[],dirty=false,selId=null,G=null,visible=new Set(),pos={},uPos={};
let colUp=new Set(),colDown=new Set();
const $=id=>document.getElementById(id);
const world=$("world"),stage=$("stage"),panel=$("panel");
const NW=200,NH=74,GAP=66,NS="http://www.w3.org/2000/svg";
const ROOT_DEFAULT="o18";
const today=()=>new Date().toISOString().slice(0,10);
if(!EDIT)document.querySelectorAll("[data-edit]").forEach(e=>e.hidden=true);

function index(){
  people={};DATA.persons.forEach(p=>{p.note=p.note||"";p.photos=p.photos||[];p.parentsU=null;p.unions=[];people[p.id]=p});
  unions=DATA.unions;
  unions.forEach(u=>{u.pa=u.pa.filter(x=>people[x]);u.ch=u.ch.filter(x=>people[x]);u.pa.forEach(x=>people[x].unions.push(u));u.ch.forEach(c=>people[c].parentsU=u)});
}
function clean(){return {version:2,persons:DATA.persons.map(({parentsU,unions,...p})=>p),unions:DATA.unions.map(u=>({id:u.id,pa:u.pa,ch:u.ch,date:u.date||""}))}}
function newId(pre){let i=1;while(people[pre+i]||unions.some(u=>u.id===pre+i))i++;return pre+i}
function markDirty(id){dirty=true;$("dirty").hidden=false;if(id&&people[id])people[id].changed=today();
  try{localStorage.setItem("stammbaum-backup",JSON.stringify(clean()))}catch(e){}
  setStatus("Nicht gespeichert");clearTimeout(saveTimer);saveTimer=setTimeout(syncNow,1500)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function dpl(d,o){return [d,o&&"in "+o].filter(Boolean).join(" ")}
function life(p){return [(p.b||p.bp)&&"* "+dpl(p.b,p.bp),(p.d||p.dp)&&"† "+dpl(p.d,p.dp)].filter(Boolean).join(" · ")}
function label(p){return p.t==="g"?p.n+" (ohne Namen)":p.n}
function rootId(){return people[ROOT_DEFAULT]?ROOT_DEFAULT:DATA.persons[0].id}

// --- Verwandtschaft ---
function ancestors(id,s=new Set()){const u=people[id].parentsU;if(u)u.pa.forEach(p=>{if(!s.has(p)){s.add(p);ancestors(p,s)}});return s}
function descendants(id,s=new Set()){people[id].unions.forEach(u=>u.ch.forEach(c=>{if(!s.has(c)){s.add(c);descendants(c,s)}}));return s}
function neighbors(id,useCol){const p=people[id],out=[];
  p.unions.forEach(u=>{u.pa.forEach(x=>out.push([x,null]));if(!useCol||!colDown.has(u.id))u.ch.forEach(c=>out.push([c,{down:u.id}]))});
  const u=p.parentsU;if(u&&(!useCol||!colUp.has(id))){u.pa.forEach(x=>out.push([x,{up:id}]));if(!useCol||!colDown.has(u.id))u.ch.forEach(c=>out.push([c,{up:id,down:u.id}]))}
  return out}
function components(){const seen=new Set(),reps=[];const order=[rootId(),...DATA.persons.map(p=>p.id)];
  for(const s of order){if(seen.has(s))continue;reps.push(s);const st=[s];seen.add(s);while(st.length){const x=st.pop();neighbors(x,false).forEach(([y])=>{if(!seen.has(y)){seen.add(y);st.push(y)}})}}return reps}
function computeVisible(){visible=new Set();const st=[];components().forEach(r=>{visible.add(r);st.push(r)});
  while(st.length){const x=st.pop();neighbors(x,true).forEach(([y])=>{if(!visible.has(y)){visible.add(y);st.push(y)}})}}
function reveal(id){if(visible.has(id))return;const r=rootId(),prev={[r]:null},q=[r];
  while(q.length){const x=q.shift();if(x===id)break;neighbors(x,false).forEach(([y,how])=>{if(!(y in prev)){prev[y]=[x,how];q.push(y)}})}
  if(!(id in prev))return;let c=id;while(prev[c]){const [x,how]=prev[c];if(how){if(how.up)colUp.delete(how.up);if(how.down)colDown.delete(how.down)}c=x}}
function setOverview(){colUp=new Set();colDown=new Set();const r=rootId();const A=ancestors(r);A.add(r);
  const depth={[r]:0},q=[r];while(q.length){const x=q.shift();const u=people[x].parentsU;if(u)u.pa.forEach(p=>{if(!(p in depth)){depth[p]=depth[x]+1;q.push(p)}})}
  Object.entries(depth).forEach(([id,d])=>{if(d===3&&people[id].parentsU)colUp.add(id)});
  unions.forEach(u=>{if(u.ch.length&&!u.ch.some(c=>A.has(c)))colDown.add(u.id)})}

// --- Layout ---
function blocksOf(ids){
  const par={};const f=x=>par[x]===x?x:(par[x]=f(par[x]));ids.forEach(i=>par[i]=i);
  unions.forEach(u=>{if(u.pa.length>1&&u.pa.every(x=>visible.has(x)))for(let i=1;i<u.pa.length;i++)par[f(u.pa[i])]=f(u.pa[0])});
  const groups={};ids.forEach(i=>(groups[f(i)]=groups[f(i)]||[]).push(i));
  return Object.values(groups).map(m=>{
    if(m.length<3){const u=unions.find(u=>u.pa.length===2&&m.includes(u.pa[0])&&m.includes(u.pa[1]));return u?u.pa.slice():m}
    const adj={};m.forEach(x=>adj[x]=new Set());unions.forEach(u=>{if(u.pa.length===2&&m.includes(u.pa[0])){adj[u.pa[0]].add(u.pa[1]);adj[u.pa[1]].add(u.pa[0])}});
    let start=m.find(x=>adj[x].size===1)||m[0];const ord=[start],seen=new Set([start]);
    while(ord.length<m.length){const nx=[...adj[ord[ord.length-1]]].find(y=>!seen.has(y))||m.find(y=>!seen.has(y));ord.push(nx);seen.add(nx)}

function layout(){
  computeVisible();
  const ids=DATA.persons.map(p=>p.id).filter(i=>visible.has(i));
  const blocks=blocksOf(ids),blockOf={};blocks.forEach((b,i)=>b.forEach(p=>blockOf[p]="b"+i));
  const g=new dagre.graphlib.Graph({multigraph:true});
  g.setGraph({rankdir:"TB",nodesep:46,ranksep:110,marginx:60,marginy:70});g.setDefaultEdgeLabel(()=>({}));
  blocks.forEach((b,i)=>g.setNode("b"+i,{width:b.length*NW+(b.length-1)*GAP,height:NH,members:b}));
  const famEdges=[];
  unions.forEach(u=>{if(!u.pa.length||!u.pa.every(x=>visible.has(x))||colDown.has(u.id))return;
    u.ch.filter(c=>visible.has(c)).forEach(c=>{const nm=u.id+">"+c;g.setEdge(blockOf[u.pa[0]],blockOf[c],{weight:2,minlen:1},nm);famEdges.push({u,c,nm})})});

  pos={};blocks.forEach((b,i)=>{const n=g.node("b"+i);let x=n.x-n.width/2;b.forEach(p=>{pos[p]={x,y:n.y-NH/2,b:"b"+i};x+=NW+GAP})});
  uPos={};
  unions.forEach(u=>{if(!u.pa.length||!u.pa.every(x=>visible.has(x)))return;
    if(u.pa.length===2){const a=pos[u.pa[0]],b=pos[u.pa[1]];const L=a.x<b.x?a:b,R=a.x<b.x?b:a;uPos[u.id]={x:(L.x+NW+R.x)/2,y:L.y+NH/2,bottom:L.y+NH,single:false,L,R}}
    else{const a=pos[u.pa[0]];uPos[u.id]={x:a.x+NW/2,y:a.y+NH+12,bottom:a.y+NH+12,single:true}}});
  // Linien-Ebenen je Familie, damit sich Querlinien nicht überdecken
  const byRow={};famEdges.forEach(e=>{const up=uPos[e.u.id];(byRow[Math.round(up.bottom)]=byRow[Math.round(up.bottom)]||{})[e.u.id]=e.u});
  const lane={};
  Object.values(byRow).forEach(row=>{
    const iv=Object.values(row).map(u=>{const xs=[uPos[u.id].x,...famEdges.filter(e=>e.u===u).map(e=>{const pts=g.edge({v:blockOf[u.pa[0]],w:blockOf[e.c],name:e.nm}).points;return pts.length>2?pts[1].x:pos[e.c].x+NW/2})];return {id:u.id,a:Math.min(...xs)-8,b:Math.max(...xs)+8}}).sort((p,q)=>p.a-q.a);
    const ends=[];iv.forEach(v=>{let k=ends.findIndex(e=>e<v.a);if(k<0){k=ends.length;ends.push(0)}ends[k]=v.b;lane[v.id]=k})});
  return {g,famEdges,blockOf,lane};
}

function render(keep){
  index();computeColors();
  let anchor=null;if(keep&&pos[keep]){anchor={x:pos[keep].x*sc+tx,y:pos[keep].y*sc+ty}}
  const {g,famEdges,blockOf,lane}=layout();
  const W=g.graph().width,H=g.graph().height;
  world.innerHTML="";world.style.width=W+"px";world.style.height=H+"px";
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("class","edges");svg.setAttribute("width",W);svg.setAttribute("height",H);world.appendChild(svg);
  world.edges=[];
  const addPath=(d,k,u,p)=>{const e=document.createElementNS(NS,"path");e.setAttribute("d",d);svg.appendChild(e);world.edges.push({el:e,k,u,p})};
  const A=new Set();
  DATA.persons.forEach(p=>{if(!visible.has(p.id))return;const P=pos[p.id],el=document.createElement("div");
    if(tintMap[p.id])el.style.setProperty("--tint",tintMap[p.id]);
    el.className="node"+(p.t?" unk":"")+(p.changed?" changed":"")+(p.note?" hasnote":"");el.tabIndex=0;el.dataset.id=p.id;
    el.style.left=P.x+"px";el.style.top=P.y+"px";
    el.innerHTML=(p.photos[0]?`<img alt="" src="${p.photos[0]}">`:"")+`<div class="txt"><div class="n">${esc(label(p))}</div>${life(p)?`<div class="d" title="${esc(life(p))}">${esc(life(p))}</div>`:""}</div>`;
    el.onclick=()=>{if(!moved)select(p.id)};el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();select(p.id)}};
    world.appendChild(el);
    if(p.parentsU){const closed=colUp.has(p.id);const hidden=closed?[...ancestors(p.id)].filter(x=>!visible.has(x)).length:0;
      if(closed&&!hidden)colUp.delete(p.id);
      tog(P.x+NW-16,P.y,closed&&hidden?`▲ ${hidden}`:"▲",closed&&hidden,closed&&hidden?`${hidden} Vorfahren einblenden`:"Vorfahren ausblenden",()=>{closed?colUp.delete(p.id):colUp.add(p.id);render(p.id)})}
  });
  unions.forEach(u=>{const U=uPos[u.id];if(!U)return;
    const el=document.createElement("div");el.className="union";el.dataset.u=u.id;el.style.left=U.x+"px";el.style.top=U.y+"px";world.appendChild(el);
    if(!U.single){addPath(`M${U.L.x+NW},${U.y}H${U.R.x}`,"pa",u,null);
      if(u.date){const t=document.createElement("div");t.className="ulabel";t.textContent="⚭ "+u.date;t.style.left=U.x+"px";t.style.top=(U.y-10)+"px";world.appendChild(t)}}
    else addPath(`M${U.x},${U.y-12}V${U.y}`,"pa",u,null);
    if(u.ch.length){const closed=colDown.has(u.id);const hidden=closed?u.ch.filter(c=>!visible.has(c)).length+u.ch.flatMap(c=>[...descendants(c)]).filter(x=>!visible.has(x)).length:0;
      const nk=u.ch.length;
      tog(U.x,U.bottom+13,closed?`▼ ${nk} ${nk===1?"Kind":"Kinder"}`:"▼",closed,closed?"Kinder einblenden":"Kinder ausblenden",()=>{closed?colDown.delete(u.id):colDown.add(u.id);render(u.pa[0])})}
  });
  famEdges.forEach(e=>{const U=uPos[e.u.id],C=pos[e.c];const pts=g.edge({v:blockOf[e.u.pa[0]],w:blockOf[e.c],name:e.nm}).points;
    const ly=U.bottom+30+(lane[e.u.id]||0)*9;const cx=C.x+NW/2,top=C.y;
    let d=`M${U.x},${U.y}V${ly}`;
    if(top-U.bottom>g.graph().ranksep+NH+40&&pts.length>2){const mids=pts.slice(1,-1);d+=`H${mids[0].x}`;mids.forEach((m,i)=>{d+=`V${m.y}`;if(mids[i+1])d+=`H${mids[i+1].x}`});d+=`V${top-22}H${cx}V${top}`}
    else d+=`H${cx}V${top}`;
    addPath(d,"ch",e.u,e.c)});
  function tog(x,y,txt,closed,title,fn){const b=document.createElement("button");b.className="tg"+(closed?" closed":"");b.textContent=txt;b.title=title;b.setAttribute("aria-label",title);
    b.style.left=x+"px";b.style.top=y+"px";b.addEventListener("pointerdown",e=>e.stopPropagation());b.onclick=e=>{e.stopPropagation();fn()};world.appendChild(b)}
  const named=DATA.persons.filter(p=>!p.t);
  const yrs=named.flatMap(p=>[p.b,p.d]).map(s=>(String(s).match(/\b(1[5-9]\d\d|20\d\d)\b/)||[])[1]).filter(Boolean).map(Number);
  const shown=named.filter(p=>visible.has(p.id)).length;
  $("meta").textContent=`${named.length} Personen`+(yrs.length?` · ${Math.min(...yrs)}–${Math.max(...yrs)}`:"")+(shown<named.length?` · ${shown} sichtbar`:"");
  $("names").innerHTML=named.slice().sort((a,b)=>a.n.localeCompare(b.n,"de")).map(p=>`<option value="${esc(p.n)}">`).join("");
  $("changes").textContent="Zuletzt bearbeitet";
  if(anchor&&pos[keep]){tx=anchor.x-pos[keep].x*sc;ty=anchor.y-pos[keep].y*sc}
  apply();if(selId&&visible.has(selId))highlight(selId);else if(selId){world.classList.remove("focus")}
}

// --- Pan & Zoom ---
let sc=0.7,tx=0,ty=0,moved=false;
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`}
function zoomAt(f,cx,cy){const ns=Math.min(2.5,Math.max(0.03,sc*f));tx=cx-(cx-tx)*ns/sc;ty=cy-(cy-ty)*ns/sc;sc=ns;apply()}
stage.addEventListener("wheel",e=>{if(e.target.closest(".panel"))return;e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const pts=new Map();let last=null,pinch=null;
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".panel,.zoom"))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}}else last={x:e.clientX,y:e.clientY}});

  if(!last)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>3||moved){if(!moved){try{stage.setPointerCapture(e.pointerId)}catch(_){}}moved=true;stage.classList.add("dragging");tx+=dx;ty+=dy;last={x:e.clientX,y:e.clientY};apply()}});
function up(e){pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){last=null;stage.classList.remove("dragging");setTimeout(()=>moved=false,0)}}
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
stage.addEventListener("click",e=>{if(moved)return;if(e.target.closest(".node,.tg,.union,.panel,.zoom,button,a,label"))return;if(!panel.hidden&&!panel.classList.contains("edit")&&!panelMin)clearSel()});
$("zin").onclick=()=>zoomAt(1.3,stage.clientWidth/2,stage.clientHeight/2);
$("zout").onclick=()=>zoomAt(1/1.3,stage.clientWidth/2,stage.clientHeight/2);
function fit(){const W=G.graph().width,H=G.graph().height;sc=Math.min(stage.clientWidth/W,stage.clientHeight/H,1);tx=(stage.clientWidth-W*sc)/2;ty=(stage.clientHeight-H*sc)/2;apply()}
function centerOn(id,z){const P=pos[id];if(!P)return;if(z)sc=z;const off=stage.clientWidth>640&&!panel.hidden&&!panelMin?-170:0;const offY=stage.clientWidth<=640&&!panel.hidden&&!panelMin?-stage.clientHeight*0.25:0;
  tx=stage.clientWidth/2+off-(P.x+NW/2)*sc;ty=stage.clientHeight/2+offY-(P.y+NH/2)*sc;apply()}
$("fit").onclick=fit;
$("overview").onclick=()=>{setOverview();render();centerOn(rootId(),0.6)};
$("openall").onclick=()=>{colUp.clear();colDown.clear();render(selId||rootId());toast("Alle Zweige aufgeklappt")};

// --- Farben / Einstellungen ---
let colorCfg={mode:"none",inv:false},tintMap={},famList=[];
try{const v=JSON.parse(localStorage.getItem("stammbaum-farbe")||"null");if(v&&v.mode)colorCfg={mode:v.mode,inv:!!v.inv}}catch(e){}
function saveColorCfg(){try{localStorage.setItem("stammbaum-farbe",JSON.stringify(colorCfg))}catch(e){}}
function famOf(p){if(p.t)return"";let n=p.n||"";const m=n.match(/\bgeb\.?\s+(.+)$/i);if(m)n=m[1];n=n.replace(/\(.*?\)/g,"").trim();const a=n.split(/\s+/);return a[a.length-1]||""}
function computeColors(){
  tintMap={};famList=[];if(colorCfg.mode==="none")return;
  const lvl={};DATA.persons.forEach(p=>lvl[p.id]=0);
  for(let it=0;it<80;it++){let ch=false;
    DATA.unions.forEach(u=>{const L=Math.max(0,...u.pa.map(x=>lvl[x]||0));
      u.pa.forEach(x=>{if(lvl[x]!==undefined&&lvl[x]<L){lvl[x]=L;ch=true}});
      u.ch.forEach(c=>{if(lvl[c]!==undefined&&lvl[c]<L+1){lvl[c]=L+1;ch=true}})});
    if(!ch)break}
  const gm=Math.max(1,...Object.values(lvl));
  if(colorCfg.mode==="gen"){
    DATA.persons.forEach(p=>{let f=lvl[p.id]/gm;if(colorCfg.inv)f=1-f;tintMap[p.id]="hsla(205,70%,48%,"+(0.55-0.47*f).toFixed(3)+")"})
  }else{

// --- Gemeinsames Speichern (db) ---
let dbNS=null,assetsNS=null,userNS=null,dlNS=null,saving=false,saveTimer=null,ready=false;
let rem={p:new Map(),u:new Map()},remoteDocs={p:new Map(),u:new Map()},got={p:false,u:false},pendingW=new Map();
const COL={p:"persons",u:"unions"};
function setStatus(t){const d=$("dirty");d.textContent=t;d.hidden=!t;d.classList.toggle("ok",t.charAt(0)==="✓")}
function canon(v){return JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,k)=>(o[k]=x[k],o),{}):x)}
async function syncNow(manual){
  clearTimeout(saveTimer);
  if(!dbNS||!ready)return;
  if(saving){saveTimer=setTimeout(syncNow,800);return}
  saving=true;setStatus("Speichert …");
  try{
    const c=clean(),now={p:new Map(c.persons.map(x=>[x.id,x])),u:new Map(c.unions.map(x=>[x.id,x]))};
    for(const k of ["p","u"]){
      const coll=dbNS.collection(COL[k]);
      if(coll.setMany){
        const ups=[],dels=[];
        for(const [id,obj] of now[k]){const js=canon(obj);if(rem[k].get(id)!==js)ups.push([id,obj,js])}
        for(const id of rem[k].keys())if(!now[k].has(id))dels.push(id);
        if(ups.length){ups.forEach(([id,,js])=>pendingW.set(k+":"+id,js));await coll.setMany(ups.map(([id,obj])=>[id,obj]));ups.forEach(([id,,js])=>rem[k].set(id,js))}
        if(dels.length){dels.forEach(id=>pendingW.set(k+":"+id,null));await coll.deleteMany(dels);dels.forEach(id=>rem[k].delete(id))}
        continue}
      for(const [id,obj] of now[k]){const js=canon(obj);if(rem[k].get(id)!==js){pendingW.set(k+":"+id,js);await coll.doc(id).set(obj);rem[k].set(id,js)}}
      for(const id of [...rem[k].keys()]){if(!now[k].has(id)){pendingW.set(k+":"+id,null);await coll.doc(id).delete();rem[k].delete(id)}}
    }
    dirty=false;setStatus("✓ Gespeichert");if(manual)toast("Gespeichert");
  }catch(err){
    const c=err&&err.code;
    if(c==="nopw"){setStatus("Nicht gespeichert – Passwort fehlt");saving=false;return}
    setStatus(c==="not_granted"||c==="revoked"?"Nur Lesezugriff – nicht gespeichert":"Speichern fehlgeschlagen – nochmal versuchen");
    saveTimer=setTimeout(syncNow,c==="not_granted"?1e9:8000);
  }finally{saving=false}
  if(!dirty)applyRemote();
}
$("save").onclick=()=>syncNow(true);
$("backup").onclick=async()=>{if(!dlNS){toast("Download hier nicht möglich");return}
  try{await dlNS.save({filename:`Stammbaum_Hoelzemann_${today()}.json`,data:JSON.stringify(clean(),null,1)})}catch(e){if(!e||e.code!=="declined")toast("Sicherung nicht möglich")}};
function onSnap(k){return snap=>{const m=new Map();snap.docs.forEach(d=>{const x=d.data();if(x)m.set(d.id,x)});remoteDocs[k]=m;got[k]=true;applyRemote()}}
function applyRemote(){
  if(!(got.p&&got.u)||saving||dirty)return;
  let changed=!ready;const cur={};
  for(const k of ["p","u"]){
    const mp=new Map();remoteDocs[k].forEach((x,id)=>mp.set(id,canon(x)));
    for(const [key,exp] of [...pendingW]){if(key[0]!==k)continue;const id=key.slice(2),have=mp.has(id)?mp.get(id):null;
      if(have===exp)pendingW.delete(key);else if(exp===null)mp.delete(id);else mp.set(id,exp)}
    cur[k]=mp;
    if(mp.size!==rem[k].size||[...mp].some(([id,js])=>rem[k].get(id)!==js))changed=true;
  }
  if(!changed)return;
  rem=cur;
  const byId=(a,b)=>a.id<b.id?-1:a.id>b.id?1:0;
  const parse=k=>[...cur[k].values()].map(js=>JSON.parse(js)).sort(byId);
  DATA={version:2,persons:parse("p"),unions:parse("u")};
  if(!DATA.persons.length){$("nojs-h").textContent="Noch keine Daten";$("nojs-p").textContent="Der Stammbaum ist noch leer.";$("nojs").hidden=false;return}
  $("nojs").hidden=true;
  if(!ready){ready=true;index();setOverview();render();requestAnimationFrame(()=>{select(rootId());centerOn(rootId(),0.6)});return}
  const editing=panel.querySelector("input,textarea,select");const keep=selId&&people[selId]?selId:null;
  render(keep);
  if(keep){if(!editing)select(keep)}else if(selId)clearSel();
}
async function boot(){
  const fail=(h,t)=>{$("nojs-h").textContent=h;$("nojs-p").textContent=t;$("nojs").hidden=false};
  try{
    if(!window.claude||!claude.use)throw 0;
    dbNS=await claude.use("db");assetsNS=await claude.use("assets");userNS=await claude.use("user");dlNS=await claude.use("downloads");
  }catch(e){dbNS=null}
  if(!dbNS)return fail("Stammbaum nicht verfügbar","Bitte den Stammbaum in claude.ai öffnen und angemeldet sein.");
  let canW=null;try{canW=userNS?await userNS.can("data.write"):null}catch(e){}
  if(canW===false){EDIT=false;document.querySelectorAll("[data-edit]").forEach(e=>e.hidden=true)}
  const t=setTimeout(()=>{if(!ready)fail("Lädt länger als gewöhnlich …","Bitte kurz warten oder die Seite neu laden.")},10000);
  const err=e=>{clearTimeout(t);fail("Stammbaum konnte nicht geladen werden","Bitte die Seite neu laden. ("+((e&&e.code)||"Fehler")+")")};
  dbNS.collection("persons").onSnapshot(s=>{clearTimeout(t);onSnap("p")(s)},err);
  dbNS.collection("unions").onSnapshot(onSnap("u"),err);
}
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!e.target.closest("input,textarea"))clearSel()});
const q=$("q");q.addEventListener("change",()=>{const v=q.value.trim().toLowerCase();if(!v)return;
  const hit=DATA.persons.find(p=>!p.t&&p.n.toLowerCase()===v)||DATA.persons.find(p=>!p.t&&p.n.toLowerCase().includes(v));

function bootLocal(){
  try{DATA=JSON.parse($("treedata").textContent)}catch(e){$("nojs-h").textContent="Daten fehlen";$("nojs-p").textContent="Diese Datei enthält keine Stammbaum-Daten.";$("nojs").hidden=false;return}
  assetsNS={upload:async b=>({url:await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Bild nicht lesbar"));r.readAsDataURL(b)})})};
  EDIT=true;$("backup").hidden=true;$("save").textContent="Als Datei speichern";$("save").onclick=saveFile;
  ready=true;$("nojs").hidden=true;index();setOverview();render();
  requestAnimationFrame(()=>{select(rootId());centerOn(rootId(),0.6)})}
function saveFile(){

  dirty=false;setStatus("✓ Datei gespeichert")}

// Zugangsdaten des Supabase-Projekts (öffentlich, geschützt durch die Regeln in der Datenbank)
const SB_URL="https://qlqyxzhkyznaoxzklnsf.supabase.co";
const SB_KEY="sb_publishable_XPiw5k-ueyv5eLGMgd0uhg_zxCuCgkM";
const SB_TABLE="docs",SB_BUCKET="fotos",PW_KEY="stammbaum-familienpasswort";
let sb=null;
function sbPw(){try{return localStorage.getItem(PW_KEY)||""}catch(e){return ""}}
function sbSetPw(v){try{v?localStorage.setItem(PW_KEY,v):localStorage.removeItem(PW_KEY)}catch(e){}}
function sbClient(){return window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false},global:{headers:{"x-familie":sbPw()}}})}
function askPw(again){
  const v=window.prompt(again?"Das Familienpasswort stimmt nicht. Bitte nochmal eingeben:":"Zum Speichern bitte einmal das Familienpasswort eingeben:");
  if(!v)return false;sbSetPw(v.trim());sb=sbClient();return true}
function sbErr(e){const x=new Error((e&&e.message)||"Fehler");x.code=e&&(e.code==="42501"||/row-level security|policy/i.test(e.message||"")||e.statusCode==="403"||e.status===403)?"denied":"failed";return x}
async function sbWrite(fn){
  if(!sbPw()&&!askPw(false)){const x=new Error("Kein Passwort");x.code="nopw";throw x}
  for(let t=0;t<2;t++){
    try{return await fn()}catch(e){if(e.code==="denied"&&t===0){sbSetPw("");if(askPw(true))continue;e.code="nopw"}throw e}
  }
}
function sbCollection(col){
  const doc=id=>({
    set:obj=>sbWrite(async()=>{const {error}=await sb.from(SB_TABLE).upsert({col,id,data:obj});if(error)throw sbErr(error)}),
    delete:()=>sbWrite(async()=>{const {error}=await sb.from(SB_TABLE).delete().match({col,id});if(error)throw sbErr(error)})
  });
  return {
    doc,
    setMany:rows=>sbWrite(async()=>{for(let i=0;i<rows.length;i+=200){const {error}=await sb.from(SB_TABLE).upsert(rows.slice(i,i+200).map(([id,data])=>({col,id,data})));if(error)throw sbErr(error)}}),
    deleteMany:ids=>sbWrite(async()=>{for(let i=0;i<ids.length;i+=200){const {error}=await sb.from(SB_TABLE).delete().eq("col",col).in("id",ids.slice(i,i+200));if(error)throw sbErr(error)}}),
    onSnapshot(cb,onErr){
      const m=new Map();
      const emit=()=>cb({docs:[...m].map(([id,x])=>({id,data:()=>x}))});
      const load=async()=>{
        const all=new Map();
        for(let from=0;;from+=1000){
          const {data,error}=await sb.from(SB_TABLE).select("id,data").eq("col",col).range(from,from+999);
          if(error)throw sbErr(error);
          data.forEach(r=>all.set(r.id,r.data));if(data.length<1000)break}
        m.clear();all.forEach((v,k)=>m.set(k,v));emit()};
      load().catch(onErr);
      sb.channel("sb-"+col).on("postgres_changes",{event:"*",schema:"public",table:SB_TABLE,filter:"col=eq."+col},ev=>{
        if(ev.eventType==="DELETE"){const id=ev.old&&ev.old.id;if(id){m.delete(id);emit()}else load().catch(()=>{})}
        else if(ev.new&&ev.new.col===col){m.set(ev.new.id,ev.new.data);emit()}}).subscribe();
      // Falls Live-Updates ausfallen: regelmäßig neu laden
      setInterval(()=>{if(!document.hidden)load().catch(()=>{})},60000);
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)load().catch(()=>{})});
    }
  };
}
async function sbUpload(blob){
  return sbWrite(async()=>{
    const ext=(blob.type||"image/jpeg").split("/")[1].replace("jpeg","jpg");
    const name=Date.now().toString(36)+Math.random().toString(36).slice(2,8)+"."+ext;
    const {error}=await sb.storage.from(SB_BUCKET).upload(name,blob,{contentType:blob.type||"image/jpeg",cacheControl:"31536000"});
    if(error)throw sbErr(error);
    return {url:sb.storage.from(SB_BUCKET).getPublicUrl(name).data.publicUrl}});
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function bootSupabase(){
  const fail=(h,t)=>{$("nojs-h").textContent=h;$("nojs-p").textContent=t;$("nojs").hidden=false};
  try{if(!window.supabase)await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js");sb=sbClient()}
  catch(e){toast("Online-Speicher nicht erreichbar – nur Ansicht");return bootLocal()}
  let seed=null;try{seed=JSON.parse($("treedata").textContent)}catch(e){}
  dbNS={collection:sbCollection};
  assetsNS={upload:sbUpload};
  dlNS={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
  $("save").onclick=()=>syncNow(true);
  const t=setTimeout(()=>{if(!ready)fail("Lädt länger als gewöhnlich …","Bitte kurz warten oder die Seite neu laden.")},12000);
  let firstErr=false;
  const err=e=>{clearTimeout(t);if(firstErr||ready)return;firstErr=true;toast("Online-Speicher nicht erreichbar – nur Ansicht");dbNS=null;bootLocal()};
  // Ersteinrichtung: Ist die Datenbank leer, werden die Daten aus dieser Datei übernommen
  let seeded=false;
  const wrap=k=>snap=>{
    clearTimeout(t);
    onSnap(k)(snap);
    if(!seeded&&got.p&&got.u&&!remoteDocs.p.size&&!remoteDocs.u.size&&seed&&seed.persons.length){
      seeded=true;DATA=seed;ready=true;$("nojs").hidden=true;index();setOverview();render();
      requestAnimationFrame(()=>{select(rootId());centerOn(rootId(),0.6)});
      dirty=true;setStatus("Noch nicht online gespeichert");toast("Einmal „Speichern“ drücken, um den Stammbaum online abzulegen")}
  };
  dbNS.collection("persons").onSnapshot(wrap("p"),err);
  dbNS.collection("unions").onSnapshot(wrap("u"),err);
}

if(SB_URL&&SB_KEY)bootSupabase();else bootLocal();
